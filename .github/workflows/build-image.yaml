name: Build & Push to GHCR
#https://gist.github.com/Shiro1n/a28f8ddc74927ed0fbdb5fa334ec7240
on:
  push:
    branches: [develop]
    tags:
      - '*'
    paths:
      - '**.sh'
      - '**.toml'
      - '**.md'
      - '**/Dockerfile'

concurrency:
  group: ghcr-build-develop
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_TAG: ${{ startsWith(github.ref, 'refs/heads/develop') && 'ghcr.io/uaiso-serious/scm-runner:latest' || startsWith(github.ref, 'refs/tags/') && format('ghcr.io/uaiso-serious/scm-runner:{0}', github.ref_name) || '' }}
      IMAGE_SHA: ghcr.io/uaiso-serious/scm-runner:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/